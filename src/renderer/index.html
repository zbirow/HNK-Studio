<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HNK Studio</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-toolbar">
          <label class="field-label" for="gameSelect">Game</label>
          <select id="gameSelect" class="game-select">
            <option value="">Select game</option>
          </select>
          <button id="openFileButton" class="primary-button" type="button" disabled>Open HNK</button>
        </div>

        <div class="file-strip">
          <div id="fileName" class="file-name">No file</div>
          <div id="providerName" class="provider-name"></div>
        </div>

        <nav id="treeRoot" class="tree-root" aria-label="HNK records"></nav>
      </aside>

      <section class="details-pane">
        <header class="details-header">
          <div>
            <h1 id="detailsTitle">HNK Studio</h1>
            <p id="detailsSubtitle">Select a game provider.</p>
          </div>
          <div id="recordCounter" class="record-counter"></div>
        </header>

        <section class="details-grid">
          <div class="panel">
            <div class="panel-title-row">
              <h2>Details</h2>
              <div id="actionBar" class="action-bar"></div>
            </div>
            <dl id="detailsList" class="details-list"></dl>
          </div>
          <div class="panel panel-fill">
            <h2>Hex Preview</h2>
            <pre id="hexPreview" class="hex-preview"></pre>
          </div>
          <div class="panel preview-panel">
            <h2>Preview</h2>
            <div id="previewArea" class="preview-area"></div>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
